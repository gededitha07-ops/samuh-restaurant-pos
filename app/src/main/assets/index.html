
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samuh Restaurant POS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #123b35;
    color: white;
    padding: 20px;
    text-align: center;
}

header h2 {
    margin: 0;
}

.container {
    padding: 16px;
}

.card {
    background: white;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #00000012;
}

button {
    background: #176b57;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 8px;
    width: 100%;
    font-size: 15px;
    margin-top: 10px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    margin-bottom: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
}

.menu-button {
    background: #e2eee9;
    color: #123b35;
    font-weight: bold;
}

.hidden {
    display: none;
}

h3 {
    margin-top: 0;
}
</style>
</head>

<body>

<header>
    <h2>SAMUH RESTAURANT</h2>
    <p>Point of Sale System</p>
</header>

<div class="container">

    <div class="card" id="login">
        <h3>Staff Login</h3>

        <label>Select User</label>
        <select id="user">
            <option value="Owner">Owner</option>
            <option value="Cashier">Cashier</option>
        </select>

        <label>Enter PIN</label>
        <input type="password" id="pin"
               inputmode="numeric" placeholder="Enter your PIN">

        <button onclick="login()">Login</button>
    </div>

    <div id="dashboard" class="hidden">

        <div class="card">
            <h3>Welcome to Samuh Restaurant</h3>
            <p id="staffName"></p>
            <button onclick="logout()">Logout</button>
        </div>

        <div class="card">
            <h3>Main Menu</h3>

            <button class="menu-button"
                onclick="openOrder()">
                New Order
            </button>

            <button class="menu-button"
                onclick="showMessage('Menu Management')">
                Menu Management
            </button>

            <button class="menu-button"
                onclick="openHeldOrders()">
                Held Orders
            </button>
            </button>

            <button class="menu-button"
                onclick="showMessage('Reports')">
                Reports
            </button>

            <button class="menu-button"
                onclick="showMessage('Settings')">
                Settings
            </button>
        </div>

    </div>

</div>

<div id="orderPage" class="hidden">

    <div class="card">
        <h3>Taking Order</h3>

        <label>Room Number</label>
        <input type="text" id="roomNumber"
               placeholder="Enter room number">

        <label>Guest Name</label>
        <input type="text" id="guestName"
               placeholder="Enter guest name">

        <label>Staff Name</label>
        <input type="text" id="orderStaffName"
               placeholder="Enter staff name">
         
        <hr>

         <h3>Order Items</h3>

         <label>Item Name</label>
         <input type="text" id="itemName"
                placeholder="Enter food or drink name">

         <label>Quantity</label>
         <input type="number" id="itemQty"
                placeholder="Enter quantity" min="1">

         <label>Unit Price (Rp)</label>
         <input type="number" id="itemPrice"
                placeholder="Enter price" min="0">

         <button onclick="addOrderItem()">
                 Add Item
         </button>

         <div id="orderItems"></div>

         <h3 id="orderTotal">Total: Rp0</h3>

        
         <button onclick="saveOrder()">
                 Hold Order
         </button>

         <button onclick="openPayment()">
                 Proceed to Payment
         </button>


        <button onclick="closeOrder()"
                style="background:#64748b">
            Back to Dashboard
        </button>
    </div>

</div>
    

<div id="paymentPage" class="hidden">
    <div class="card">
        <h3>Payment</h3>

        <p id="paymentTotal">Grand Total: Rp0</p>

        <label>Payment Method</label>
        <label>Payment Method</label>
        <select id="paymentMethod"
                onchange="updatePaymentMethod()">
            <option value="Cash">Cash</option>
            <option value="Bank Payout">Bank Payout</option>
            <option value="Sign">Sign - Charge to Room</option>
        </select>

        <div id="cashPayment">
            <label>Amount Received (Rp)</label>
            <input type="number" id="amountReceived"
       placeholder="Enter amount received"
       oninput="calculateChange()">
            <p id="changeAmount">Change: Rp0</p>
        </div>

        <button onclick="completePayment()">
            Complete Payment
        </button>

        <button onclick="backToOrder()"
                style="background:#64748b">
            Back to Order
        </button>
    </div>
</div>

<script>
const ownerPIN = "1234";
const cashierPIN = "1111";

function login() {
    const user = document.getElementById("user").value;
    const pin = document.getElementById("pin").value;

    if (
        (user === "Owner" && pin === ownerPIN) ||
        (user === "Cashier" && pin === cashierPIN)
    ) {
        document.getElementById("login").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        document.getElementById("staffName").textContent =
            "Logged in as: " + user;
        document.getElementById("pin").value = "";
    } else {
        alert("Incorrect PIN. Please try again.");
    }
}

function logout() {
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
}

function showMessage(name) {
    alert(name + " feature will be added.");
}
 
function openOrder() {
    currentOrderId = null;
    currentOrderItems = [];
    displayOrderItems();

    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("orderPage").classList.remove("hidden");
}

function closeOrder() {
    document.getElementById("orderPage").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
}



function saveOrder() {
    const room = document.getElementById("roomNumber").value.trim();
    const guest = document.getElementById("guestName").value.trim();
    const staff = document.getElementById("orderStaffName").value.trim();

    if (!room || !guest || !staff) {
        alert("Please complete all order information.");
        return;
    }

    if (currentOrderItems.length === 0) {
        alert("Please add at least one order item.");
        return;
    }

    const total = currentOrderItems.reduce(
        (sum, item) => sum + item.total, 0
    );

    let orders = JSON.parse(
        localStorage.getItem("samuhOrders") || "[]"
    );

    if (currentOrderId !== null) {
        const index = orders.findIndex(
            order => order.id === currentOrderId
        );

        if (index !== -1) {
            orders[index] = {
                ...orders[index],
                roomNumber: room,
                guestName: guest,
                staffName: staff,
                items: [...currentOrderItems],
                subtotal: total,
                status: "Held"
            };
        }
    } else {
        orders.push({
            id: Date.now().toString(),
            roomNumber: room,
            guestName: guest,
            staffName: staff,
            items: [...currentOrderItems],
            subtotal: total,
            date: new Date().toISOString(),
            status: "Held"
        });
    }

    localStorage.setItem("samuhOrders", JSON.stringify(orders));

    alert("Order saved successfully.");

    currentOrderItems = [];
    currentOrderId = null;
    displayOrderItems();

    document.getElementById("roomNumber").value = "";
    document.getElementById("guestName").value = "";
    document.getElementById("orderStaffName").value = "";

    closeOrder();
}

function openPayment() {
    const room = document.getElementById("roomNumber").value.trim();
    const guest = document.getElementById("guestName").value.trim();
    const staff = document.getElementById("orderStaffName").value.trim();

    if (!room || !guest || !staff) {
        alert("Please complete all order information.");
        return;
    }

    if (currentOrderItems.length === 0) {
        alert("Please add at least one order item.");
        return;
    }

    const total = currentOrderItems.reduce(
        (sum, item) => sum + item.total, 0
    );

    document.getElementById("paymentTotal").textContent =
        "Grand Total: Rp" + total.toLocaleString("id-ID");

    document.getElementById("orderPage").classList.add("hidden");
    document.getElementById("paymentPage").classList.remove("hidden");
}

function updatePaymentMethod() {
    const method = document.getElementById("paymentMethod").value;
    const cashSection = document.getElementById("cashPayment");

    if (method === "Cash") {
        cashSection.classList.remove("hidden");
    } else {
        cashSection.classList.add("hidden");
    }
}

function calculateChange() {
    const received = Number(
        document.getElementById("amountReceived").value
    );

    const totalText =
        document.getElementById("paymentTotal").textContent;

    const total = Number(
        totalText.replace(/\D/g, "")
    );

    const change = Math.max(0, received - total);

    document.getElementById("changeAmount").textContent =
        "Change: Rp" + change.toLocaleString("id-ID");
}

function completePayment() {
    const method = document.getElementById("paymentMethod").value;

    const total = currentOrderItems.reduce(
        (sum, item) => sum + item.total, 0
    );

    const received = method === "Cash"
        ? Number(document.getElementById("amountReceived").value)
        : total;

    if (method === "Cash" && received < total) {
        alert("Amount received is not enough.");
        return;
    }

    const orders = JSON.parse(
        localStorage.getItem("samuhOrders") || "[]"
    );

    const orderData = {
        id: currentOrderId || Date.now().toString(),
        roomNumber: document.getElementById("roomNumber").value.trim(),
        guestName: document.getElementById("guestName").value.trim(),
        staffName: document.getElementById("orderStaffName").value.trim(),
        items: [...currentOrderItems],
        subtotal: total,
        paymentMethod: method,
        amountReceived: received,
        change: method === "Cash" ? received - total : 0,
        status: method === "Sign" ? "Unpaid" : "Paid",
        date: new Date().toISOString()
    };

    const index = orders.findIndex(
        order => order.id === orderData.id
    );

    if (index !== -1) {
        orders[index] = orderData;
    } else {
        orders.push(orderData);
    }

    localStorage.setItem("samuhOrders", JSON.stringify(orders));

    alert(method === "Sign"
        ? "Order saved as unpaid room charge."
        : "Payment completed successfully.");

    currentOrderItems = [];
    currentOrderId = null;

    displayOrderItems();

    document.getElementById("paymentPage").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
}

function backToOrder() {
    document.getElementById("paymentPage").classList.add("hidden");
    document.getElementById("orderPage").classList.remove("hidden");
}


 
let currentOrderItems = [];
let currentOrderId = null;

function addOrderItem() {
    const name = document.getElementById("itemName").value.trim();
    const qty = Number(document.getElementById("itemQty").value);
    const price = Number(document.getElementById("itemPrice").value);

    if (!name || !Number.isInteger(qty) || qty < 1 ||
        !Number.isFinite(price) || price < 0) {
        alert("Please enter a valid item, quantity and price.");
        return;
    }

    currentOrderItems.push({
        name: name,
        quantity: qty,
        price: price,
        total: qty * price
    });

    displayOrderItems();

    document.getElementById("itemName").value = "";
    document.getElementById("itemQty").value = "";
    document.getElementById("itemPrice").value = "";
}

function displayOrderItems() {
    const container = document.getElementById("orderItems");
    let total = 0;

    container.innerHTML = "";

    currentOrderItems.forEach((item, index) => {
        total += item.total;

        const div = document.createElement("div");
        div.className = "card";
        div.textContent =
            item.name + " x " + item.quantity +
            " = Rp" + item.total.toLocaleString("id-ID");

        container.appendChild(div);
    });

    document.getElementById("orderTotal").textContent =
        "Total: Rp" + total.toLocaleString("id-ID");
}
    
  
<div id="heldOrdersPage" class="hidden">
    <div class="card">
        <h3>Held Orders</h3>

        <div id="heldOrdersList">
            No held orders yet.
        </div>

        <button onclick="closeHeldOrders()"
                style="background:#64748b">
            Back to Dashboard
        </button>
    </div>
</div>

function openHeldOrders() {
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("heldOrdersPage").classList.remove("hidden");

    displayHeldOrders();
}

function closeHeldOrders() {
    document.getElementById("heldOrdersPage").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
}


function displayHeldOrders() {
    const orders = JSON.parse(
        localStorage.getItem("samuhOrders") || "[]"
    );

    const container = document.getElementById("heldOrdersList");
    container.innerHTML = "";

    const held = orders
        .map((order, index) => ({order, index}))
        .filter(item => item.order.status === "Held");

    if (held.length === 0) {
        container.textContent = "No held orders yet.";
        return;
    }

    held.forEach(({order, index}) => {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        title.textContent = "Room " + order.roomNumber;

        const details = document.createElement("p");
        details.textContent =
            "Guest: " + order.guestName +
            " | Staff: " + order.staffName;

        const total = document.createElement("p");
        total.textContent =
            "Total: Rp" + order.subtotal.toLocaleString("id-ID");

        const button = document.createElement("button");
        button.textContent = "Open Order";
        button.onclick = () => openHeldOrder(index);

        card.append(title, details, total, button);
        container.appendChild(card);
    });
}

function openHeldOrder(index) {
    let orders = JSON.parse(
        localStorage.getItem("samuhOrders") || "[]"
    );

    const order = orders[index];

    if (!order) return;
    currentOrderId = order.id;

    document.getElementById("roomNumber").value = order.roomNumber;
    document.getElementById("guestName").value = order.guestName;
    document.getElementById("orderStaffName").value = order.staffName;

    currentOrderItems = order.items || [];
    displayOrderItems();

    document.getElementById("heldOrdersPage").classList.add("hidden");
    document.getElementById("orderPage").classList.remove("hidden");
}


    orders.forEach((order, index) => {
        if (order.status !== "Held") return;

        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        title.textContent = "Room " + order.roomNumber;

        const details = document.createElement("p");
        details.textContent =
            "Guest: " + order.guestName +
            " | Staff: " + order.staffName;

        const total = document.createElement("p");
        total.textContent =
            "Total: Rp" + order.subtotal.toLocaleString("id-ID");

        card.append(title, details, total);
        container.appendChild(card);
    });
}
    
updatePaymentMethod();
</script>

</body>
</html>
